<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vue入门</title>
</head> 
<body>
<div id="app">
    <h1>{{ message }}</h1>
    <h2>{{ count }}</h2>
</div>

<script type="module">
  import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

  createApp({
    // 准备数据 
    data() {
      return {
        message: 'hello vue',
        count: 66
      }
    }
  }).mount('#app')
</script>


    
</body>
</html>
