<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js事件</title>
</head>
<body>
    <!-- 定义一个按钮，叫点我一下试试 -->
    <button id="btn1">点我一下试试1</button>
    <button id="btn2">点我一下试试2</button>
<script>
    // 事件监听
    // 1. 找到元素
    const btn1 = document.getElementById('btn1');
    const btn2 = document.getElementById('btn2');
    // 2. 监听事件
    btn1.addEventListener('click', function () {
        console.log('你点击了按钮1');
    });
    btn2.addEventListener('click', function () {
        console.log('你点击了按钮2');
    });
</script>
    
</body>
</html>
